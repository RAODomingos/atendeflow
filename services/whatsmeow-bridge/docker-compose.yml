services:
  wa-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: atendeflow/whatsmeow-bridge
    container_name: wa-bridge
    restart: unless-stopped
    ports:
      # Fica em rede interna; o app fala por http://wa-bridge:8090
      - "127.0.0.1:8090:8090"
    environment:
      BRIDGE_ADDR: ":8090"
      BRIDGE_DATA_DIR: "/data"
      # Mesmo token do app (env/.env -> WHATSMEOW_BRIDGE_TOKEN)
      BRIDGE_TOKEN: "${WHATSMEOW_BRIDGE_TOKEN:-}"
      # URL publica da bridge (usada no envelope do webhook); vazio = usa o host da requisicao
      BRIDGE_PUBLIC_URL: "${WHATSMEOW_BRIDGE_PUBLIC_URL:-}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      # Credenciais das sessoes (um SQLite por canal)
      - wa-bridge-data:/data

volumes:
  wa-bridge-data:
