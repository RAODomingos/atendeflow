# =============================================================================
# AtendeFlow / OminiDesk — vhost nginx CANÔNICO (versionado no projeto)
# Fonte única da verdade: edite AQUI, nunca direto no sites-enabled.
#
# Como ativa (Laragon/Windows):
#   C:/laragon/etc/nginx/sites-enabled/atendeflow.test.conf deve conter
#   apenas UMA linha:
#       include "C:/laragon/www/atendeflow/deploy/nginx/atendeflow.test.conf";
#   Depois: nginx -t && nginx -s reload
#   (sem prefixo "auto." no stub para o Laragon não sobrescrever)
#
# Atende QUALQUER link que aponte para o projeto:
#   - por hostname:  http://atendeflow.test/  |  https://<xxx>.ngrok-free.dev/
#   - por subpasta:  https://<xxx>.ngrok-free.dev/atendeflow/ | http://localhost/atendeflow/
#
# Levando para produção (Linux):
#   - troque root/alias para o caminho real (ex.: /var/www/atendeflow/public)
#   - troque `fastcgi_pass php_upstream;` por `fastcgi_pass unix:/run/php/php8.3-fpm.sock;`
#   - ajuste ssl_certificate/_key (Let's Encrypt) e access_log/error_log
#   - remova `localhost 127.0.0.1` e os wildcards ngrok do server_name
#   - APP_URL pode voltar ao .env com a URL pública (ou deixe vazio: auto-detecta)
# =============================================================================
server {
    listen 80 default_server;
    listen 443 ssl;
    server_name atendeflow.test *.atendeflow.test
                localhost 127.0.0.1
                *.ngrok-free.dev *.ngrok-free.app *.ngrok.io;

    root "C:/laragon/www/atendeflow/public";
    index index.php index.html index.htm;
    charset utf-8;

    # Apps do Laragon (phpmyadmin, adminer...) continuam acessíveis por este conf,
    # já que ele agora é o catch-all (ex.: http://atendeflow.test/phpmyadmin).
    include "C:/laragon/etc/nginx/alias/*.conf";

    # Uploads: app permite até 10MB (UPLOAD_MAX_SIZE) — margem 32M
    client_max_body_size 32M;
    client_body_timeout 60s;

    # --- 1) Servindo pela RAIZ (atendeflow.test, domínio ngrok direto, ...) ---
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # --- 2) Servindo por SUBPASTA /atendeflow (ngrok + /atendeflow, localhost/atendeflow) ---
    # ^~ : este prefixo vence as locations regex (assets/PHP da raiz não capturam /atendeflow/*).
    # NOTA: com `alias` evita-se try_files (combinação sabidamente problemática);
    # usa-se `if (!-e ...) + rewrite last`, que resolve o caminho já com alias.
    location = /atendeflow {
        return 301 /atendeflow/;
    }
    # Estáticos da subpasta: prefixo LONGO + alias (forma canônica, sem regex).
    location ^~ /atendeflow/assets/ {
        alias "C:/laragon/www/atendeflow/public/assets/";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location ^~ /atendeflow/uploads/ {
        alias "C:/laragon/www/atendeflow/public/uploads/";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        location ~* \.php$ {
            return 403;
        }
    }
    location ^~ /atendeflow/wiki-frontend/ {
        alias "C:/laragon/www/atendeflow/public/wiki-frontend/";
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location ^~ /atendeflow/ {
        alias "C:/laragon/www/atendeflow/public/";
        index index.php;
        # O único .php executável aqui é o front controller (location exata
        # abaixo tem precedência); qualquer outro .php direto -> 403.
        location ~* \.php$ {
            return 403;
        }
        if (!-e $request_filename) {
            rewrite ^ /atendeflow/index.php last;
        }
    }
    # Front controller da subpasta: SCRIPT_NAME real para o app detectar a base;
    # o Request::uri() remove o prefixo /atendeflow antes de rotear.
    # NOTA: não usa snippets/fastcgi-php.conf porque o `try_files` de lá valida
    # contra `root` (public/atendeflow/index.php não existe) e daria 404.
    location = /atendeflow/index.php {
        include fastcgi.conf;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME "C:/laragon/www/atendeflow/public/index.php";
        fastcgi_param SCRIPT_NAME "/atendeflow/index.php";
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
    }
    # Qualquer outro .php sob /atendeflow -> nega (evita execução arbitrária)
    location ~ ^/atendeflow/.*\.php$ {
        return 403;
    }

    # --- Assets estáticos da RAIZ: cache agressivo ---
    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Wiki frontend estático (raiz) ---
    # (o da subpasta /atendeflow/wiki-frontend/ está no bloco acima)
    location /wiki-frontend/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }

    # --- Uploads da RAIZ: servir direto, mas NUNCA executar PHP ali dentro ---
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        location ~* \.php$ {
            return 403;
        }
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- PHP da RAIZ via Laragon php-cgi upstream ---
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
        # Repassa Authorization (equivale à regra HTTP_AUTHORIZATION do .htaccess)
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Segurança: nega dotfiles, .htaccess, .env, backups, logs ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* (\.env$|\.git|\.svn|\.sql$|\.log$|\.bak$|\.backup$|composer\.(json|lock)$) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Security headers (equivale ao bloco mod_headers do .htaccess) ---
    # CSP propositalmente ausente: o app usa JS inline.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # --- Gzip (equivale ao mod_deflate do .htaccess) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml font/woff2;

    # --- SSL Laragon (auto-assinado local) ---
    ssl_certificate "C:/laragon/etc/ssl/laragon.crt";
    ssl_certificate_key "C:/laragon/etc/ssl/laragon.key";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log "C:/laragon/bin/nginx/nginx-1.30.4/logs/atendeflow.access.log";
    error_log "C:/laragon/bin/nginx/nginx-1.30.4/logs/atendeflow.error.log" warn;
}
